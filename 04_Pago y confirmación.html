<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TecnoCafé - Confirmación del pedido</title>
    <meta name="description"
        content="Página de confirmación del pedido de TecnoCafé con código QR para recogida exprés." />
    <link rel="icon" href="images/favicon.png" />
</head>

<body>
    <header>
        <p><a href="03_carrito_y_hora_de_recogida.html">&larr; Volver al carrito</a></p>
        <h1>¡Pedido confirmado!</h1>
        <p>Tu pedido estará listo a las <strong>10:30</strong>.</p>
    </header>
    <main>
        <section>
            <h2>Código de recogida</h2>
            <img src="https://placehold.co/600x400" alt="Código QR para la recogida del pedido" width="150" />
            <p><strong>TC4587</strong></p>
        </section>
        <section>
            <h2>Resumen de tu pedido</h2>
            <ul>
                <li>
                    <img src="images/croissant.jpg" alt="Croissant" width="40" />
                    Croissant x1 — 1,80 €
                </li>
                <li>
                    <img src="images/cafe.jpg" alt="Café" width="40" />
                    Café x1 — 1,20 €
                </li>
            </ul>
            <p><strong>Total: 3,00 €</strong></p>
        </section>
        <section>
            <p><a href="index.html">Volver al inicio</a></p>
        </section>
</body>

</html>
