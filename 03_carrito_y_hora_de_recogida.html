<!-- Figma: DESIGN > pantalla 3 / carrito y hora de recogida -->
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="widith=device-width, initial-scale=1.0">
    <meta name="description"
        content="Gestiona tu pedido mediante el carrito de compra y selecciona la hora de recogida antes de realizar el pago." />
    <title>Carrito de Compra y Recogida</title>
    <link rel="icon" type="image/png" href="images/favicon.png" />
</head>

<body style="font-family: inter, sans-serif;">
    <header>
        <div>
            <div>
                <button>
                    <a href="02_detalle_del_producto.html">
                        <img src="images/back.png" alt="Volver atras" width="32px" />
                    </a>
                </button>
            </div>
            <div>
                <button>
                    <img src="images/list.png" alt="Menu desplegable" width="32px" />
                </button>
            </div>
        </div>
    </header>

    <br /><br />

    <section>
        <article>
            <img src="images/croissant.jpg" alt="Foto croissant" width="128px" />
            <h2>Croissant</h2>
            <p>1,80 €</p>
            <div>
                <button>
                    <img src="images/minus.png" alt="Quitar 1 unidad" width="16px" />
                </button>
                <p>1</p>
                <button>
                    <img src="images/more.png" alt="Agregar 1 unidad más" width="16px" />
                </button>
            </div>
        </article>

        <br />

        <article>
            <img src="images/cafe.jpg" alt="Foto croissant" width="128px" />
            <h2>Café</h2>
            <p>1,20 €</p>
            <div>
                <button>
                    <img src="images/minus.png" alt="Quitar 1 unidad" width="16px" />
                </button>
                <p>1</p>
                <button>
                    <img src="images/more.png" alt="Agregar 1 unidad más" width="16px" />
                </button>
            </div>
        </article>
    </section>


    <br /><br />
    <hr />

    <section>
        <div>
            <h1>Total</h1>
        </div>

        <div>
            <h1>3,00 €</h1>
        </div>
    </section>

    <br />

    <div>
        <h3>Selecciona la hora de recogida</h3>

        <input type="radio" id="hora1" name="hora">
        <label for="hora1">10:00</label>

        <input type="radio" id="hora2" name="hora" checked>
        <label for="hora2">10:30</label>

        <input type="radio" id="hora3" name="hora">
        <label for="hora3">11:00</label>

        <input type="radio" id="hora4" name="hora">
        <label for="hora4">11:30</label>
    </div>

    <br><br />
    <button>
        <a href="04_pago_y_confirmacion.html">
            Proceder al pago
        </a>
    </button>

</body>

</html>
